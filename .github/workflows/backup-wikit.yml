name: 自动备份网站

concurrency:
  group: backup-wikit
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: '30 4 */2 * *'
  workflow_dispatch:
    inputs:
      timeout:
        required: false
        default: '1m'

permissions:
  contents: write

jobs:
  backup-wikit:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      WIKIT_BIN: "./wikit"
      BACKUP_ROOT: "backups/wikit"
      WIKI_NAME: "scp-wiki-cloud"
      BACKUP_TIMEOUT: ${{ inputs.timeout || '5h' }}
      GRACE_PERIOD: "180s"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载 wikit
        run: |
          set -euo pipefail
          curl -fSL "https://github.com/kakushi-w/wikit/releases/latest/download/wikit-linux-amd64" -o wikit
          chmod +x wikit
          ./wikit version || true

      - name: 备份
        run: |
          set -uo pipefail
          mkdir -p "$BACKUP_ROOT"

          df -h /
          BEFORE=$(find "$BACKUP_ROOT" -type f | wc -l)
          START=$(date +%s)

          set +e
          timeout --signal=INT --kill-after="$GRACE_PERIOD" "$BACKUP_TIMEOUT" \
            "$WIKIT_BIN" backup "$WIKI_NAME" \
              --base-dir "$BACKUP_ROOT" \
              --refresh-votes \
              --checkpoint-pages 10
          RC=$?
          set -e

          ELAPSED=$(( $(date +%s) - START ))
          AFTER=$(find "$BACKUP_ROOT" -type f | wc -l)

          case "$RC" in
            0)           STATUS=complete ;;
            124|137|130) STATUS=timeout ;;
            *)           STATUS=error ;;
          esac

          echo "exit=$RC status=$STATUS elapsed=${ELAPSED}s files=$BEFORE->$AFTER"
          df -h /

          {
            echo "BACKUP_STATUS=$STATUS"
            echo "BACKUP_RC=$RC"
            echo "BACKUP_ELAPSED=$ELAPSED"
            echo "BACKUP_ADDED=$((AFTER - BEFORE))"
            echo "BACKUP_TS=$(date '+%Y-%m-%d %H:%M')"
          } >> "$GITHUB_ENV"

      - name: 提交
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$BACKUP_ROOT"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "备份 ${WIKI_NAME} ${BACKUP_TS} [${BACKUP_STATUS}] +${BACKUP_ADDED}"
          git pull --rebase --autostash || true
          git push || git push

      - name: 异常退出
        if: env.BACKUP_STATUS == 'error'
        run: exit 1
